<div *ngIf="showModalCreate">

    <div style="background-color: rgba(0,0,0,0.6);position: fixed;top:0;left:0;width:100%;height:100%;display:flex;justify-content:center;align-items:center;"
        (click)="closeModalCreate()">
        <div class="bg-white p-4 rounded text-center" style="width:500px" (click)="$event.stopPropagation()">
            <form [formGroup]="seasonForm" (ngSubmit)="saveSeason()">
                <!-- <h2 >Crear Nuevo Torneo</h2> -->
                <h2>{{ selectedSeasonId ? 'Editar Temporada' : 'Crear Nueva Temporada' }}</h2>
                <div class="d-flex flex-column gap-3 p-3">
                    <label for="name" class="me-auto">Nombre de la  Temporada:</label>
                    <input id="name" type="text" formControlName="name" placeholder="Temporada tilin"
                        class="form-control">
              
                    <!-- <input id="season" type="text" formControlName="season" placeholder="Temporada 2026"
                        class="form-control"> -->

                    <div>
                        <label>
                            <input type="checkbox" formControlName="active" />
                            ¿Temporada Activa?
                        </label>
                    </div>

                </div>

                <button class="btn btn-success mt-3 w-100" (click)="closeModalCreate()">
                    <div>{{ selectedSeasonId ? 'Editar Temporada' : 'Crear Nueva Temporada' }}</div>
                </button>

            </form>
        </div>
    </div>

</div>
