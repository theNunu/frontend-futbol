<p>update-season works!</p>
<p-dialog 
  [(visible)]="display" 
  header="Editar Noticia" 
  [modal]="true" 
  [style]="{ width: '50vw' }"
  [draggable]="false"
  [resizable]="false"
  (onHide)="closeDialog()">
  
  <app-form-seasons
    *ngIf="display && season"
    [dataSeason]="season"
    [isSubmitting]="isSaving"
    (onSave)="updateSeason($event)" 
    (onCancel)="closeDialog()">
  </app-form-seasons>

</p-dialog>
