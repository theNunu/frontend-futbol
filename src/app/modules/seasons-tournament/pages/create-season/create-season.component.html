<p-dialog 
  [(visible)]="display" 
  header="Nueva Noticia" 
  [modal]="true" 
  [style]="{ width: '50vw' }"
  [draggable]="false"
  [resizable]="false"
  (onHide)="closeDialog()">
  
  <app-form-seasons
    *ngIf="display"
    [isSubmitting]="isSaving"
    (onSave)="saveNoticia($event)" 
    (onCancel)="closeDialog()">
  </app-form-seasons>

</p-dialog>
