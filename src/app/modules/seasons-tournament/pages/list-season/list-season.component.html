<div class="flex justify-between align-items-center mb-4">
    <h2>Gestión de Temporadas</h2>
    <p-button label="Nueva Temporada" icon="pi pi-plus" severity="success" (onClick)="openCreate()">
    </p-button>
</div>

<div class="container mt-5">
    <!-- <div>
        @for (item of seasons; track item.season_id) {
        <li>{{ item.name }}</li>
        } @empty {
        <li>No hay elementos.</li>
        }

    </div> -->

    <p-table [value]="seasons" [tableStyle]="{ 'min-width': '50rem' }">
        <ng-template pTemplate="header">
            <tr>
                <th>seson id</th>
                <th>Name</th>
                <th>Estado</th>
                <!-- <th>Quantity</th> -->
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-season>
            <tr>
                <td>{{ season.season_id }}</td>
                <td>{{ season.name }}</td>
                <td>{{ season.active }}</td>

                <div class="flex gap-2">
                    <!-- <p-button icon="pi pi-pencil" severity="warning" [rounded]="true" [text]="true"
                        (onClick)="openUpdate(product)">
                    </p-button> -->
                    <p-button icon="pi pi-pencil" severity="warn" [rounded]="true" [text]="true" (onClick)="openUpdate(season)"></p-button>
                </div>
                    <!-- <td>{{ product.quantity }}</td> -->
            </tr>
        </ng-template>
    </p-table>


</div>

<!-- COMPONENTES DE PÁGINAS ACCIONABLES COMO MODALES -->
<app-create-season [(display)]="showCreateModal" (onCreated)="cargarNoticias()">
</app-create-season>

<app-update-season [(display)]="showUpdateModal" [season]="selectedSeason" (onUpdated)="cargarNoticias()">
</app-update-season>
