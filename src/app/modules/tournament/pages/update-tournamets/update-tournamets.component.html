<p-dialog 
  [(visible)]="display" 
  header="Editar Torneo" 
  [modal]="true" 
  [style]="{ width: '50vw' }"
  [draggable]="false"
  [resizable]="false"
  (onHide)="closeDialog()">
  
  <app-form-tournaments
    *ngIf="display && tournament"
    [dataTournament]="tournament"
    [isSubmitting]="isSaving"
    (onSave)="actualizarTournament($event)" 
    (onCancel)="closeDialog()">
  </app-form-tournaments>

</p-dialog>
