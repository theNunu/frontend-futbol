<div class="d-flex gap-3">
    <div> <i class="fa-solid fa-trophy fa-3x" style="color: rgb(73, 77, 254);"></i></div>
    <div class="h1">Torneos</div>
</div>

<div class="container mt-5">
    <p-table [value]="tournaments" [tableStyle]="{ 'min-width': '50rem' }">
        <ng-template pTemplate="header">
            <tr>
                <th>torneo ID</th>
                <th>nombre</th>
                <th>nombre temporada</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-item>
            <tr>
                <td>{{ item.tournament_id }}</td>
                <td>{{ item.name }}</td>
                <td>{{ item.season }}</td>
            </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="2" class="text-center p-4">No hay banners para mostrar.</td>
            </tr>
        </ng-template>
    </p-table>
</div>
