<div class="d-flex gap-3">
    <div> <i class="fa-solid fa-trophy fa-3x" style="color: rgb(73, 77, 254);"></i></div>
    <div class="h1">Torneos</div>
</div>

<div class="flex justify-between align-items-center mb-4">
    <p-button label="Nuevo Torneo" icon="pi pi-plus" severity="success" (onClick)="openCreate()">
    </p-button>
</div>
<div class="container mt-5">
    <p-table [value]="tournaments" [tableStyle]="{ 'min-width': '50rem' }">
        <ng-template pTemplate="header">
            <tr>
                <th>torneo ID</th>
                <th>nombre</th>
                <th>nombre temporada</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-item>
            <tr>
                <td>{{ item.tournament_id }}</td>
                <td>{{ item.name }}</td>
                <td>{{ item.season }}</td>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-item>
            <tr>
                <td>{{ item.tournament_id }}</td>
                <td>{{ item.name }}</td>
                <td>{{ item.season }}</td>
                <td>
                    <p-button 
                      icon="pi pi-pencil" 
                      severity="warn" 
                      [rounded]="true" 
                      [text]="true" 
                      (onClick)="openUpdate(item)">
                    </p-button>
                </td>
            </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="2" class="text-center p-4">No hay torneos para mostrar.</td>
            </tr>
        </ng-template>
    </p-table>
</div>


<!-- COMPONENTES DE PÁGINAS ACCIONABLES COMO MODALES -->
<app-create-tournamets [(display)]="showCreateModal" (onCreated)="bringTournaments()">
</app-create-tournamets>

<app-update-tournamets
  [(display)]="showUpdateModal" 
  [tournament]="selectedTournament"
  (onUpdated)="bringTournaments()">
</app-update-tournamets>
