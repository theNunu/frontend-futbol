<p-dialog 
  [(visible)]="display" 
  header="Nuevo Torneo" 
  [modal]="true" 
  [style]="{ width: '50vw' }"
  [draggable]="false"
  [resizable]="false"
  (onHide)="closeDialog()">
  
  <app-form-tournaments
    *ngIf="display"
    [isSubmitting]="isSaving"
    (onSave)="registrarTournament($event)" 
    (onCancel)="closeDialog()">
  </app-form-tournaments>

</p-dialog>
