<!--  -->
<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

    <!-- Columna ID -->
    <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> ID </th>
        <td mat-cell *matCellDef="let usuario"> {{usuario.news_id}} </td>
    </ng-container>

    <!-- Columna Nombre -->
    <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef> Titulo </th>
        <td mat-cell *matCellDef="let usuario"> {{usuario.title}} </td>
    </ng-container>

       <ng-container matColumnDef="summary">
        <th mat-header-cell *matHeaderCellDef> Resumen </th>
        <td mat-cell *matCellDef="let usuario"> {{usuario.summary}} </td>
    </ng-container>


    <tr mat-header-row *matHeaderRowDef="columnasMostradas"></tr>
    <tr mat-row *matRowDef="let fila; columns: columnasMostradas;"></tr>
</table>

<!-- Opcional: Paginador -->
<mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
