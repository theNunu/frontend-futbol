<p-dialog 
  [(visible)]="display" 
  header="Actualizar Banner" 
  [modal]="true" 
  [style]="{ width: '50vw' }"
  [draggable]="false"
  [resizable]="false"
  (onHide)="closeDialog()">
  
  <app-form-banners
    *ngIf="display"
    [dataBanner]="bannerData"
    [isSubmitting]="isSaving"
    (onSave)="actualizarBanner($event)" 
    (onCancel)="closeDialog()">
  </app-form-banners>

</p-dialog>
